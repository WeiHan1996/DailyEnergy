packages:
  - apps/*
  - packages/*

allowBuilds:
  # E-005 does not use Next Image optimization. Keep the transitive native
  # install script disabled instead of widening the supply-chain allowlist.
  sharp: false

catalog:
  "@babel/core": 8.0.1
  "@babel/eslint-parser": 8.0.1
  "@eslint/js": 10.0.1
  "@nestjs/common": 11.1.28
  "@nestjs/core": 11.1.28
  "@nestjs/platform-express": 11.1.28
  "@playwright/test": 1.62.0
  "@types/express": 5.0.6
  miniprogram-api-typings: 5.2.2
  miniprogram-automator: 0.12.1
  "@types/node": 24.13.3
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@types/supertest": 7.2.1
  dependency-cruiser: 18.1.0
  eslint: 10.8.0
  express: 5.2.1
  globals: 17.8.0
  next: 16.2.12
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  server-only: 0.0.1
  supertest: 7.2.2
  typescript: 7.0.2
  vitest: 4.1.10
  yaml: 2.9.0
  zod: 4.4.3

disallowWorkspaceCycles: true
engineStrict: true
linkWorkspacePackages: false
nodeVersion: 24.18.0
pmOnFail: error
savePrefix: ""
saveWorkspaceProtocol: rolling
sharedWorkspaceLockfile: true
