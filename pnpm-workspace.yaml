packages:
  - apps/*
  - packages/*

allowBuilds:
  # Prisma and tsx require their pinned install-time binaries. Optional native
  # transports remain disabled because E-006 uses the local Docker socket only.
  "@prisma/engines": true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  sharp: false
  ssh2: false

catalog:
  "@babel/core": 8.0.1
  "@babel/eslint-parser": 8.0.1
  "@eslint/js": 10.0.1
  "@nestjs/common": 11.1.28
  "@nestjs/core": 11.1.28
  "@nestjs/platform-express": 11.1.28
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/exporter-prometheus": 0.221.0
  "@opentelemetry/exporter-trace-otlp-http": 0.221.0
  "@opentelemetry/resources": 2.10.0
  "@opentelemetry/sdk-node": 0.221.0
  "@playwright/test": 1.62.0
  "@prisma/adapter-pg": 7.9.1
  "@prisma/client": 7.9.1
  "@testcontainers/postgresql": 12.0.4
  "@vitest/coverage-v8": 4.1.10
  "@types/express": 5.0.6
  "@types/pg": 8.15.5
  miniprogram-api-typings: 5.2.2
  miniprogram-automator: 0.12.1
  "@types/node": 24.13.3
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@types/supertest": 7.2.1
  bullmq: 5.81.3
  dependency-cruiser: 18.1.0
  eslint: 10.8.0
  express: 5.2.1
  globals: 17.8.0
  ioredis: 5.11.1
  next: 16.3.0
  pg: 8.22.0
  prettier: 3.9.6
  prisma: 7.9.1
  react: 19.2.8
  react-dom: 19.2.8
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  server-only: 0.0.1
  supertest: 7.2.2
  testcontainers: 12.0.4
  tsx: 4.20.6
  typescript: 7.0.2
  vitest: 4.1.10
  yaml: 2.9.0
  zod: 4.4.3

disallowWorkspaceCycles: true
engineStrict: true
linkWorkspacePackages: false
nodeVersion: 24.18.0
pmOnFail: error
savePrefix: ""
saveWorkspaceProtocol: rolling
sharedWorkspaceLockfile: true

overrides:
  "@prisma/config@7.9.1>deepmerge-ts": 8.0.0
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  "fast-uri@>=3.0.0 <3.1.5": 3.1.5
  "nanoid@>=3.0.0 <3.3.18": 3.3.18

minimumReleaseAgeExclude:
  - "@next/env@16.3.0"
  - "@next/swc-darwin-arm64@16.3.0"
  - "@next/swc-darwin-x64@16.3.0"
  - "@next/swc-linux-arm64-gnu@16.3.0"
  - "@next/swc-linux-arm64-musl@16.3.0"
  - "@next/swc-linux-x64-gnu@16.3.0"
  - "@next/swc-linux-x64-musl@16.3.0"
  - "@next/swc-win32-arm64-msvc@16.3.0"
  - "@next/swc-win32-x64-msvc@16.3.0"
  - next@16.3.0
