version: 1
projectContext: docs/agent/PROJECT_CONTEXT.md

taskRules:
  - match: E-015
    profile: code
    sources:
      - path: AGENTS.md
        required: true
        reason: Repository-wide execution and safety rules
      - path: tasks/current.md
        required: true
        reason: Current task scope and handoff
      - path: docs/agent/workflow.md
        required: true
        reason: Accepted agent workflow
      - path: docs/technical/repository-structure.md
        required: true
        reason: Tooling and dependency boundaries
      - path: docs/technical/testing.md
        required: true
        reason: Validation and fixture evidence rules
      - path: docs/technical/deployment.md
        required: false
        reason: Secret, artifact, and environment boundaries
      - path: docs/technical/observability.md
        required: false
        reason: Redaction and bounded diagnostic boundaries
      - path: docs/decisions/ADR-0006-monorepo-and-stack.md
        required: true
        reason: Accepted capability boundary decision

