    MatterRef:
      name: matter_ref
      in: path
      required: true
      schema:
        type: string
    TaskRef:
      name: task_ref
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  schemas:
    CommandRequest:
      type: object
      required: [command_ref]
      properties:
        command_ref:
          type: string
          minLength: 8
        client_context:
          type: object
          additionalProperties: true
      additionalProperties: true

    RevisionedCommand:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            expected_revision:
              type: integer
              minimum: 0
            expected_revisions:
              type: object
              additionalProperties:
                type: integer
                minimum: 0

    CommandWithNoticeVersion:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          required: [notice_version]
          properties:
            notice_version:
              type: string

    WechatSessionRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        channel:
          type: string
          description: Optional acquisition channel summary

    OnboardingCompleteRequest:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          properties:
            preferred_name:
              type: string
            expression_style:
              type: string
              enum: [BALANCED, GENTLE, LIGHT_HUMOR, CLEAR_DIRECT]

    ProfileUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/RevisionedCommand'
        - type: object
          properties:
            preferred_name:
              type: string
            expression_style:
              type: string
              enum: [BALANCED, GENTLE, LIGHT_HUMOR, CLEAR_DIRECT]

    CheckinSubmitRequest:
      allOf:
        - $ref: '#/components/schemas/CommandRequest'
        - type: object
          required: [mood, energy, sleep]
          properties:
            mood:
              type: string
            energy:
              type: string
            sleep:
              type: string

    CheckinCorrectRequest:
      allOf:
        - $ref: '#/components/schemas/RevisionedCommand'
        - type: object
          properties:
            mood:
              type: string
            energy:
              type: string
            sleep:
              type: string

    EveningSaveRequest:
      allOf:
        - $ref: '#/components/schemas/RevisionedCommand'
        - type: object
          description: Coordinated multi-component save; field shapes follow shared-schemas
          properties:
            overall_feeling:
              type: string
            note:
              type: object
              additionalProperties: true
            helpfulness:
              type: string
            task_patch:
              type: object
              additionalProperties: true

    ApiErrorBody:
      type: object
      required: [ok, request_id, server_now, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        request_id:
          type: string
        server_now:
          type: string
          format: date-time
        product_date:
          type: string
          format: date
        error:
          type: object
          required: [code, category, message_key, message, retryable]
          properties:
            code:
              type: string
            category:
              type: string
              enum:
                - AUTH
                - GUARD
                - VALIDATION
                - CONFLICT
                - NOT_FOUND
                - RATE_LIMIT
                - TRANSIENT
                - TERMINAL
                - SAFETY
            message_key:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
            safety_view:
              type: object
              additionalProperties: true
            command_receipt:
              type: object
              additionalProperties: true

    ApiSuccessBase:
      type: object
      required: [ok, request_id, server_now, product_date, product_date_policy_version, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        request_id:
          type: string
        server_now:
          type: string
          format: date-time
        product_date:
          type: string
          format: date
        product_date_policy_version:
          type: string
        data: {}

    ApiSuccessLaunch:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'

  responses:
    Error:
      description: Normalized API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    SuccessObject:
      description: Successful object payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessBase'
    SuccessList:
      description: Successful list payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessBase'
    SuccessCommand:
      description: Command receipt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessBase'
    SuccessSession:
      description: Session established
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessBase'
    SuccessEmpty:
      description: Empty success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiSuccessBase'
