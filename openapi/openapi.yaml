openapi: 3.0.3
info:
  title: DailyEnergy API
  description: |
    Draft OpenAPI for S-20. Semantic authority is docs/technical/api.md and
    docs/technical/error-codes.md. Content field shapes for daily/evening/weekly
    client views remain defined by packages/shared-schemas (Zod).
  version: api-contract-v1
  contact:
    name: DailyEnergy
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder host — environment fixed in deployment docs
tags:
  - name: Auth
  - name: Bootstrap
  - name: Consent
  - name: Profile
