components:
  securitySchemes:
    userBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: user_session_token
      description: Ordinary miniapp session; never accepted as an admin session.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: admin_session_token
      description: Independent admin identity and MFA session.
    safetyContinuationAuth:
      type: apiKey
      in: header
      name: X-Safety-Continuation
      description: Opaque, short-lived Safety-only continuation. Grants no ordinary account access.
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/RequestId"
      description: Optional client correlation id; server always returns the canonical id.
    AcceptLanguageHeader:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        default: zh-CN
        enum:
          - zh-CN
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/CommandRef"
      description: Must exactly equal body command_ref.
    IntentRef:
      name: intent_ref
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueRef"
    ProductDatePath:
      name: product_date
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProductDate"
    EndDatePath:
      name: end_date
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProductDate"
    MatterRef:
      name: matter_ref
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueRef"
    TaskRef:
      name: task_ref
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OpaqueRef"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  headers:
    RequestIdResponseHeader:
      description: Canonical request correlation id; equals body request_id.
      schema:
        $ref: "#/components/schemas/RequestId"
    RetryAfterResponseHeader:
      description: Delay in seconds before retry; equals error.details.retry_after_seconds when present.
      schema:
        type: integer
        minimum: 0
        maximum: 86400
  schemas:
    OpaqueRef:
      x-source-contract: OpaqueIdSchema
    CommandRef:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
    ProductDate:
      x-source-contract: ProductDateSchema
    VersionToken:
      x-source-contract: VersionTokenSchema
    Semver:
      x-source-contract: SemverSchema
    Revision:
      x-source-contract: RevisionSchema
    PositiveRevision:
      x-source-contract: PositiveRevisionSchema
    ClientContext:
      type: object
      properties:
        app_version:
          type: string
          minLength: 1
          maxLength: 64
        scene:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    ExpressionStyle:
      x-source-contract: ExpressionStyleSchema
    Mood:
      x-source-contract: MoodSchema
    Energy:
      x-source-contract: EnergySchema
    Sleep:
      x-source-contract: SleepSchema
    OverallFeeling:
      x-source-contract: OverallFeelingSchema
    HelpfulnessRating:
      x-source-contract: HelpfulnessRatingSchema
    HelpfulnessState:
      x-source-contract: HelpfulnessStateSchema
    TaskStatus:
      x-source-contract: TaskStatusSchema
    WriteWindow:
      x-source-contract: WriteWindowSchema
    RelationshipStage:
      x-source-contract: RelationshipStageSchema
    WechatSessionRequest:
      x-source-contract: WechatSessionRequestSchema
    LogoutRequest:
      type: object
      properties:
        command_ref:
          $ref: "#/components/schemas/CommandRef"
        client_context:
          $ref: "#/components/schemas/ClientContext"
      additionalProperties: false
      required:
        - command_ref
    ReauthVerifyRequest:
      type: object
      properties:
        command_ref:
          $ref: "#/components/schemas/CommandRef"
        client_context:
          $ref: "#/components/schemas/ClientContext"
        confirmation_challenge_ref:
          $ref: "#/components/schemas/OpaqueRef"
        wechat_code:
          type: string
          minLength: 1
          maxLength: 256
      additionalProperties: false
      required:
        - command_ref
        - confirmation_challenge_ref
        - wechat_code
    ConsentAcceptRequest:
      type: object
      properties:
        command_ref:
          $ref: "#/components/schemas/CommandRef"
        client_context:
          $ref: "#/components/schemas/ClientContext"
        notice_version:
