<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta
      name="description"
      content="DailyEnergy S-04 静态可点击原型，用于验证首次一分钟、今日内容、晚间反馈和七天回望。"
    >
    <title>DailyEnergy · S-04 可点击原型</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="prototype-layout">
      <aside class="prototype-notes" aria-label="原型说明">
        <p class="eyebrow">DAILYENERGY · S-04</p>
        <h1>每天一分钟，<br>先看见今天的自己。</h1>
        <p class="prototype-intro">
          这是无网络、无账号、无真实数据的交互原型。右侧手机中的所有资料均为虚构演示内容。
        </p>
        <div class="prototype-key">
          <span><i class="key-dot key-dot--real"></i>真实记录</span>
          <span><i class="key-dot key-dot--energy"></i>娱乐与行动参考</span>
          <span><i class="key-dot key-dot--system"></i>系统状态</span>
        </div>
        <button class="button button--quiet demo-open" type="button" data-action="open-demo-panel">
          打开演示场景
        </button>
        <p class="prototype-hint">建议先完成“新用户首次体验”，再切换异常与边界场景。</p>
      </aside>

      <div class="device-wrap">
        <div class="device" role="group" aria-label="DailyEnergy 手机原型">
          <div class="device-status" aria-hidden="true">
            <span>09:41</span>
            <span class="status-icons">● ◒ ▰</span>
          </div>
          <div id="system-banner" class="system-banner" hidden></div>
          <main id="app" class="app" tabindex="-1"></main>
          <div class="home-indicator" aria-hidden="true"></div>
        </div>
        <button
          class="demo-fab"
          type="button"
          data-action="open-demo-panel"
          aria-label="打开原型场景控制"
        >
          <span aria-hidden="true">⌘</span>
          <span>演示</span>
        </button>
      </div>
    </div>

    <div id="demo-backdrop" class="backdrop" hidden></div>
    <section
      id="demo-panel"
      class="demo-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="demo-title"
      hidden
    >
      <div class="panel-head">
        <div>
          <p class="eyebrow">仅用于原型测试</p>
          <h2 id="demo-title">演示场景</h2>
        </div>
        <button class="icon-button" type="button" data-action="close-demo-panel" aria-label="关闭演示场景">×</button>
      </div>
      <p class="panel-copy">切换场景会复位当前演示数据，不代表正式产品存在场景选择器。</p>
      <div id="scenario-list" class="scenario-list"></div>
      <button class="button button--secondary button--block" type="button" data-action="reset-prototype">
        重置当前场景
      </button>
    </section>

    <div id="modal-backdrop" class="backdrop" hidden></div>
    <section
      id="confirm-modal"
      class="confirm-modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-description"
      hidden
    >
      <p class="eyebrow">请确认影响</p>
      <h2 id="confirm-title">确认操作</h2>
      <p id="confirm-description"></p>
      <div id="confirm-impact" class="confirm-impact"></div>
      <div class="modal-actions">
        <button class="button button--danger button--block" type="button" data-action="confirm-danger"></button>
        <button class="button button--quiet button--block" type="button" data-action="cancel-danger">取消</button>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="./app.js" defer></script>
  </body>
</html>
