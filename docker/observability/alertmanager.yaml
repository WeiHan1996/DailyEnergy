route:
  receiver: local-null
  group_by: [alertname, environment, service, cause_family]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-null
      matchers:
        - severity=~"PAGE_CRITICAL|PAGE_HIGH"
      continue: false

inhibit_rules:
  - source_matchers:
      - severity="PAGE_CRITICAL"
    target_matchers:
      - severity=~"PAGE_HIGH|TICKET"
    equal: [environment, service, cause_family]
  - source_matchers:
      - alert_class="SLO_BURN_14_4"
    target_matchers:
      - alert_class=~"SLO_BURN_6|SLO_BURN_TICKET"
    equal: [environment, service, slo_id]

receivers:
  - name: local-null

templates: []
